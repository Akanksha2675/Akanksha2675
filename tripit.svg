<svg xmlns="http://www.w3.org/2000/svg" width="900" height="146" viewBox="0 0 900 146" role="img" aria-label="TripIt" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#fe428e"/><stop offset="0.55" stop-color="#a855f7"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>
<style>.ln{stroke-dasharray:720;stroke-dashoffset:720;animation:d 1.4s ease-out 0.0s forwards}@keyframes d{to{stroke-dashoffset:0}}.fi{opacity:0;animation:f .9s ease-out 0.2s forwards}@keyframes f{to{opacity:1}}.ar{animation:a 2.2s ease-in-out infinite}@keyframes a{0%,100%{transform:translate(0,0)}50%{transform:translate(5px,-5px)}}.pl{animation:p 1.8s ease-in-out infinite}@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}</style>
<text x="0" y="70" font-family="Segoe UI,Ubuntu,Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="none" stroke="url(#g)" stroke-width="1.4" opacity="0.45">01</text>
<text class="fi" x="100" y="38" font-family="Segoe UI,Ubuntu,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="url(#g)">TripIt</text>
<line class="ln" x1="100" y1="52" x2="820" y2="52" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
<text class="fi" x="100" y="80" font-family="Segoe UI,Ubuntu,Helvetica,Arial,sans-serif" font-size="14.5" fill="#8b949e">AI multi-agent travel planner with 6 specialized agents (Orchestrator, Transport, Hotel,</text>
<text class="fi" x="100" y="99" font-family="Segoe UI,Ubuntu,Helvetica,Arial,sans-serif" font-size="14.5" fill="#8b949e">Activities, Budget, Executioner) planning trips and tracking budgets in real time.</text>
<text class="fi" x="100" y="126" font-family="Consolas,Menlo,monospace" font-size="13" font-weight="600" fill="#0ea5e9">React  ·  TanStack Start  ·  Gemini API  ·  Supabase  ·  Razorpay</text>
<g class="ar"><text x="858" y="38" font-family="Segoe UI,Ubuntu,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#a855f7">↗</text></g>
</svg>